<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — لوحة تحكم Luna Spa</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <div class="mark">L</div>
    <h1>لوحة تحكم Luna Spa</h1>
    <p class="sub">سجّلي الدخول للوصول إلى لوحة إدارة الموقع</p>

    <form id="login-form">
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" required placeholder="admin@example.com">
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <p class="login-error" id="login-error"></p>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">تسجيل الدخول</button>
    </form>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("login-btn");
  const errorBox = document.getElementById("login-error");
  errorBox.classList.remove("show");
  btn.disabled = true;
  btn.textContent = "جاري تسجيل الدخول...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if(error){
    errorBox.textContent = "بيانات الدخول غير صحيحة. يرجى المحاولة مرة أخرى.";
    errorBox.classList.add("show");
    btn.disabled = false; btn.textContent = "تسجيل الدخول";
    return;
  }

  const { data: adminRow, error: adminError } = await supabaseClient
    .from("admins").select("user_id").eq("user_id", data.user.id).maybeSingle();

  if(adminError || !adminRow){
    await supabaseClient.auth.signOut();
    errorBox.textContent = "هذا الحساب غير مصرّح له بالدخول إلى لوحة التحكم.";
    errorBox.classList.add("show");
    btn.disabled = false; btn.textContent = "تسجيل الدخول";
    return;
  }

  window.location.href = "dashboard.html";
});

(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(session){
    const { data: adminRow } = await supabaseClient.from("admins").select("user_id").eq("user_id", session.user.id).maybeSingle();
    if(adminRow) window.location.href = "dashboard.html";
  }
})();
</script>
</body>
</html>
